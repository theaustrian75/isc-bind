# Example BIND config for the container volume mount (/etc/bind).
# Copy into a host path (e.g. config/bind/) and bind-mount at runtime.
# Do not put TSIG keys, DNSSEC private keys, or TLS private keys in tracked
# files — include them from gitignored paths under config/bind/ or /certs/.

http local {
	endpoints { "/dns-query"; };
};

options {
	directory "/var/cache/bind";

	# Safe default for an authoritative / stub image: disable recursion.
	# Enable recursion only behind an ACL if you intend a resolver.
	recursion no;
	allow-recursion { none; };
	allow-query { any; };

	listen-on { any; };
	listen-on-v6 { any; };

	# Ephemeral TLS certs — fine for lab; replace with mounted certs for production.
	listen-on tls ephemeral { any; };
	listen-on-v6 tls ephemeral { any; };
	listen-on tls ephemeral http local { any; };
	listen-on-v6 tls ephemeral http local { any; };
};

