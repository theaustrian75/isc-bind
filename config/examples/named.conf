# Example BIND config for the container volume mount (/etc/bind).
# Copy into config/bind/ (or another BIND_CONFIG_DIR) and bind-mount at runtime.
# Do not put TSIG / DDNS update keys, DNSSEC private keys, or TLS private keys
# in tracked files — TSIG under config/bind/; PEMs under certs/bind/.
# DDNS: named.conf.ddns.example + ddns-tsig.key.example

http local {
	endpoints { "/dns-query"; };
};

options {
	directory "/var/cache/bind";

	# Safe default for an authoritative / stub image: disable recursion.
	# Enable recursion only behind an ACL if you intend a resolver.
	recursion no;
	allow-recursion { none; };
	allow-query { any; };

	listen-on { any; };
	listen-on-v6 { any; };

	# Lab: ephemeral TLS for DoT/DoH. Production: mount PEMs at /etc/bind/certs
	# and use an explicit tls block, e.g.:
	#   tls dottls {
	#     cert-file "/etc/bind/certs/fullchain.pem";
	#     key-file "/etc/bind/certs/privkey.pem";
	#   };
	#   listen-on port 853 tls dottls { any; };
	listen-on tls ephemeral { any; };
	listen-on-v6 tls ephemeral { any; };
	listen-on tls ephemeral http local { any; };
	listen-on-v6 tls ephemeral http local { any; };
};

# include "/etc/bind/named.conf.local";
# include "/etc/bind/named.conf.ddns";
